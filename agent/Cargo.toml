[package]
name = "tickets-agent"
version = "0.1.0"
edition = "2024"
# rig-core 0.44 declares 1.95; the Docker builder pins the toolchain explicitly.
rust-version = "1.95"
license = "MIT"
publish = false
description = "Rig-based agent service for the support-ticket template (rust-agent branch)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tickets-agent"
path = "src/main.rs"

# Exact pins for the crates that evolve fastest and whose public APIs this
# service is written against. Rig in particular reshapes its API between minor
# releases (0.44 split the agent runtime into `rig-agent` and MCP into
# `rig-rmcp`), so a floating requirement would be an undocumented assumption.
# Upgrading any of these is a deliberate change: see docs/RUST-BRANCH-MAINTENANCE.md.
[dependencies]
rig-core = { version = "=0.44.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "=0.44.0", default-features = false }
rig-rmcp = { version = "=0.44.0" }
# The same rmcp release line as mcp-server/, so client and server speak one SDK.
rmcp = { version = "=2.2.0", default-features = false, features = [
  "client",
  "reqwest",
  "transport-streamable-http-client-reqwest",
] }

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
futures = "0.3.34"
async-stream = "0.3.6"
tokio-stream = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is deprecated (RUSTSEC-2024-0320); serde-saphyr is maintained and
# deserialize-only, which is all a configuration file needs.
serde-saphyr = "=1.3.0"

regex = "1.13"
# Same versions as mcp-server/, whose verifier source the tests compile.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
uuid = { version = "1.27", features = ["v4", "v5"] }
thiserror = "2"
anyhow = "1"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
opentelemetry = { version = "=0.33.0", features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.0", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = [
  "trace",
  "http-proto",
  "reqwest-blocking-client",
] }
tracing-opentelemetry = { version = "=0.34.0" }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The real MCP server's tool macros, to stand up an in-process MCP server in
# integration tests that the production rmcp client talks to over HTTP.
rmcp = { version = "=2.2.0", default-features = false, features = [
  "client",
  "server",
  "macros",
  "schemars",
  "reqwest",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
schemars = "1"
tokio-util = "0.7"
opentelemetry_sdk = { version = "=0.33.0", features = ["trace", "testing"] }
# Compiles mcp-server/src/approval.rs into a test so agent-minted tokens are
# checked by the MCP server's own verifier source, not a copy of it.
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
