[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nat-streaming-chat"
version = "0.2.2"
description = "Lean direct-OpenAI guarded streaming workflow for NeMo Agent Toolkit"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."nat.components"]
nat_streaming_chat = "nat_streaming_chat.register"
