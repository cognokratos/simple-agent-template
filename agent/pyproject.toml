[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nat-streaming-react"
version = "0.1.9"
description = "ETF research ReAct workflow with native HITL approvals, text-aware Guardrails, MCP tools, and MLflow/OpenTelemetry tracing for NeMo Agent Toolkit 1.8"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."nat.components"]
nat_streaming_react = "nat_streaming_react.register"
