[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nat-streaming-react"
version = "0.1.3"
description = "Native-tool ReAct workflow with text-aware streaming guardrails for NeMo Agent Toolkit"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."nat.components"]
nat_streaming_react = "nat_streaming_react.register"
