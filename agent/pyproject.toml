[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nat-streaming-react"
version = "0.2.0"
description = "Native-tool ReAct workflow with text-aware streaming guardrails and unified MLflow tracing with reliable ChatRequest input guardrails, deterministic critical-pattern fallback, narrow read-only ticket allow override, explicit Guardrails decisions, self-check prompt capture, a bounded guard-model input, and live MLflow evaluation metadata for NeMo Agent Toolkit 1.9"
requires-python = ">=3.11,<3.14"
# Original code is MIT; register.py, text_guardrails.py and
# observability/otlp_exporter.py keep Apache-2.0 (see THIRD_PARTY_NOTICES.md).
license = "MIT AND Apache-2.0"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."nat.components"]
nat_streaming_react = "nat_streaming_react.register"
