# A stable project identity, so container, network, image and default volume
# names do not derive from whatever directory the repository was cloned into —
# otherwise `docker ps` brands the stack after somebody's folder.
#
# This is the *default*, not a lock: `COMPOSE_PROJECT_NAME` and `docker compose
# -p` both take precedence over it. Compose feeds whichever one actually wins —
# `-p`, the environment variable, or this file default, in that order — back
# into `${COMPOSE_PROJECT_NAME}` for the rest of this file, and every
# persistent volume below keys its own default off that same resolved value
# (see the `volumes:` section). That is what lets two clones of this template
# (or a template checkout and a domain fork) run side by side on one Docker
# host with genuinely separate storage, not just separate containers.
name: ${COMPOSE_PROJECT_NAME:-tickets-agent}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickets}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./db/guardrail_test_fixtures.sql:/docker-entrypoint-initdb.d/002-guardrail-test-fixtures.sql:ro
      - ./db/injection_test_fixtures.sql:/docker-entrypoint-initdb.d/003-injection-test-fixtures.sql:ro
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickets} -d ${POSTGRES_DB:-tickets}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak-realm-init:
    image: python:3.12-alpine
    command: ["python", "/config/generate_realm.py"]
    environment:
      KEYCLOAK_REALM_OUTPUT: /import/tickets-realm.json
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-tickets}
      KEYCLOAK_GATEWAY_CLIENT_ID: ${KEYCLOAK_GATEWAY_CLIENT_ID:-tickets-gateway}
      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET:-dev-gateway-client-secret-change-me}
      KEYCLOAK_AGENT_USERNAME: ${KEYCLOAK_AGENT_USERNAME:-agent}
      KEYCLOAK_AGENT_PASSWORD: ${KEYCLOAK_AGENT_PASSWORD:-agent}
      KEYCLOAK_AGENT_EMAIL: ${KEYCLOAK_AGENT_EMAIL:-agent@example.test}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-http://localhost:3000/api/gateway/auth/callback}
      UI_PUBLIC_URL: ${UI_PUBLIC_URL:-http://localhost:3000}
    volumes:
      - ./keycloak/generate_realm.py:/config/generate_realm.py:ro
      - keycloak-import:/import
    networks:
      - auth_net
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
      - start-dev
      - --import-realm
      - --hostname=${KEYCLOAK_PUBLIC_URL:-http://localhost:8082}
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - keycloak-import:/opt/keycloak/data/import:ro
    networks:
      - edge
      - auth_net
    depends_on:
      keycloak-realm-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      # Host port only; the container port is fixed because KEYCLOAK_PUBLIC_URL
      # and the OIDC issuer are derived from it.
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8082}:8080"
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp-server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tickets}:${POSTGRES_PASSWORD:-tickets}@postgres:5432/${POSTGRES_DB:-tickets}
      MCP_BIND_ADDRESS: 0.0.0.0:8080
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mcp-server,mcp-server:8080,localhost,localhost:8080,127.0.0.1,127.0.0.1:8080,::1}
      MCP_API_KEY: ${MCP_API_KEY:-dev-mcp-api-key-change-me}
      # Optional human-approval feature. UNSET by default, and that is what keeps
      # this server read-only: with no secret it routes no execution endpoint, so
      # there is no mutation surface rather than a disabled one. Must be >= 24
      # characters and identical to the agent's. See docs/APPROVALS.md.
      HITL_APPROVAL_SECRET: ${HITL_APPROVAL_SECRET-}
      RUST_LOG: ${RUST_LOG:-tickets_mcp_server=info,rmcp=info}
    networks:
      - mcp_net
      - data_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      start_period: 10s
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional. Started only by `docker compose --profile dev up mcp-inspector`
  # (or `make inspector`), so the default stack does not run a debugging UI.
  # Bound to loopback and token-authenticated: it speaks to the MCP server with
  # the real service credential, so an unauthenticated Inspector would be a
  # complete bypass of the MCP boundary.
  mcp-inspector:
    profiles: ["dev"]
    build:
      context: ./mcp-server/inspector
    command:
      - --web
      - --config
      - /tmp/mcp.json
    environment:
      MCP_INSPECTOR_API_TOKEN: ${MCP_INSPECTOR_API_TOKEN:-dev-mcp-inspector-token-change-me}
      MCP_API_KEY: ${MCP_API_KEY:-dev-mcp-api-key-change-me}
      MCP_AUTO_OPEN_ENABLED: "false"
    volumes:
      - ./mcp-server/inspector/mcp.template.json:/config/mcp.template.json:ro
    networks:
      - edge
      - mcp_net
    depends_on:
      mcp-server:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:6274:6274"
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "*"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - edge
      - telemetry_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Host port only. 5000 is a common collision — macOS AirPlay Receiver and
      # any other MLflow on the machine both want it — and the container port
      # must stay 5000 because MLFLOW_TRACKING_URI addresses it over the
      # internal network. Set MLFLOW_PORT to move the host side alone.
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    networks:
      - edge
      - telemetry_net
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:4318:4318"
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:13133:13133"
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      args:
        # Baked into the image so GET /version reports the commit this agent was
        # built from, not whatever the host tree happens to be at eval time.
        AGENT_BUILD_COMMIT: ${GIT_COMMIT:-unknown}
    environment:
      # Provider-neutral. The defaults target a local Ollama because that is what
      # this template is verified against; point these at any OpenAI-compatible
      # endpoint instead and nothing else changes.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_GUARD_MODEL: ${LLM_GUARD_MODEL:-qwen3:8b}
      # `-` not `:-`, so an explicitly empty value stays empty and the parameter
      # is omitted entirely. A hosted provider that rejects reasoning_effort
      # needs it absent, not set to "none" or to "".
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-none}
      LLM_GUARD_REASONING_EFFORT: ${LLM_GUARD_REASONING_EFFORT-none}
      TICKETS_MCP_URL: http://mcp-server:8080/mcp
      MCP_API_KEY: ${MCP_API_KEY:-dev-mcp-api-key-change-me}
      # Optional human-approval feature; see the MCP service above and
      # agent/config.yml. Both must be set, and config.yml must declare the
      # function and expose it, before the model has any way to change state.
      HITL_APPROVAL_SECRET: ${HITL_APPROVAL_SECRET-}
      HITL_ENABLE_INTERACTIVE: ${HITL_ENABLE_INTERACTIVE:-false}
      # Fail closed on an interaction whose owner this agent did not record.
      # Safe to enable when the approval feature is the only interaction type in
      # use; leave unset if NAT's OAuth consent flow is also used.
      HITL_STRICT_INTERACTION_OWNERSHIP: ${HITL_STRICT_INTERACTION_OWNERSHIP:-false}
      NAT_GATEWAY_API_KEY: ${AGENT_API_KEY:-dev-agent-api-key-change-me}
      OTEL_COLLECTOR_TRACES_ENDPOINT: ${OTEL_COLLECTOR_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tickets-agent}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      NAT_TRACE_CONTENT_MAX_CHARS: ${NAT_TRACE_CONTENT_MAX_CHARS:-65536}
      GUARDRAILS_TRACE_CAPTURE_CONTENT: ${GUARDRAILS_TRACE_CAPTURE_CONTENT:-true}
      GUARDRAILS_TRACE_CAPTURE_RAW_OUTPUT: ${GUARDRAILS_TRACE_CAPTURE_RAW_OUTPUT:-false}
      GUARDRAILS_TRACE_MAX_CHARS: ${GUARDRAILS_TRACE_MAX_CHARS:-16384}
      GUARDRAILS_INPUT_DETERMINISTIC_FALLBACK: ${GUARDRAILS_INPUT_DETERMINISTIC_FALLBACK:-true}
      GUARDRAILS_INPUT_READ_ONLY_ALLOW_OVERRIDE: ${GUARDRAILS_INPUT_READ_ONLY_ALLOW_OVERRIDE:-true}
      GUARDRAILS_INPUT_BLOCK_MESSAGE: "${GUARDRAILS_INPUT_BLOCK_MESSAGE:-I'm sorry, I can't help with that request.}"
      GUARDRAILS_RAIL_POOL_SIZE: ${GUARDRAILS_RAIL_POOL_SIZE:-4}
      # Ceiling on a streamed answer buffered for PII masking (see
      # text_guardrails._pii_buffer_limit); only relevant when the "mask
      # sensitive data on output" flow is enabled in config.yml. Read
      # directly by the agent process, so it must reach this container's
      # environment, not just docs/.env.example.
      GUARDRAILS_PII_MAX_BUFFER_CHARS: ${GUARDRAILS_PII_MAX_BUFFER_CHARS:-200000}
      NAT_TRACE_CAPTURE_CONTENT: ${NAT_TRACE_CAPTURE_CONTENT:-true}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-true}
    depends_on:
      mcp-server:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent_net
      - mcp_net
      - telemetry_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    environment:
      GATEWAY_BIND_ADDRESS: 0.0.0.0:8081
      UI_PUBLIC_URL: ${UI_PUBLIC_URL:-http://localhost:3000}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-http://localhost:3000/api/gateway/auth/callback}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8082}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-tickets}
      KEYCLOAK_GATEWAY_CLIENT_ID: ${KEYCLOAK_GATEWAY_CLIENT_ID:-tickets-gateway}
      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET:-dev-gateway-client-secret-change-me}
      AGENT_WORKFLOW_URL: http://agent:8000/v1/workflow/full
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-agent-api-key-change-me}
      AGENT_FILTER_STEPS: TOOL_START,TOOL_END,FUNCTION_START,FUNCTION_END
      GATEWAY_COOKIE_SECURE: ${GATEWAY_COOKIE_SECURE:-false}
      GATEWAY_SESSION_TTL_SECONDS: ${GATEWAY_SESSION_TTL_SECONDS:-28800}
      GATEWAY_MAX_SESSIONS: ${GATEWAY_MAX_SESSIONS:-1000}
      GATEWAY_MAX_PENDING_LOGINS: ${GATEWAY_MAX_PENDING_LOGINS:-1000}
      GATEWAY_MAX_STREAMS_PER_SESSION: ${GATEWAY_MAX_STREAMS_PER_SESSION:-4}
      GATEWAY_UPSTREAM_TIMEOUT_SECONDS: ${GATEWAY_UPSTREAM_TIMEOUT_SECONDS:-10}
      GATEWAY_MAX_MESSAGES: ${GATEWAY_MAX_MESSAGES:-100}
      GATEWAY_MAX_MESSAGE_CHARS: ${GATEWAY_MAX_MESSAGE_CHARS:-32768}
      GATEWAY_MAX_TOTAL_MESSAGE_CHARS: ${GATEWAY_MAX_TOTAL_MESSAGE_CHARS:-262144}
      GATEWAY_SESSION_COOKIE: ${GATEWAY_SESSION_COOKIE:-tickets_gateway_session}
      GATEWAY_CSRF_COOKIE: ${GATEWAY_CSRF_COOKIE:-tickets_gateway_csrf}
      GATEWAY_LOGIN_COOKIE: ${GATEWAY_LOGIN_COOKIE:-tickets_gateway_login}
      RUST_LOG: ${GATEWAY_RUST_LOG:-tickets_auth_gateway=info}
    networks:
      - gateway_net
      - auth_net
      - agent_net
    depends_on:
      keycloak:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8081/ready"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:8081
      UI_PUBLIC_URL: ${UI_PUBLIC_URL:-http://localhost:3000}
      GATEWAY_CSRF_COOKIE: ${GATEWAY_CSRF_COOKIE:-tickets_gateway_csrf}
      UI_TOOL_NAMES: ${UI_TOOL_NAMES:-search_tickets,get_ticket}
    networks:
      - edge
      - gateway_net
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # Host port only. 3000 collides often — it is Next.js's own default, and
      # also open-webui's, Grafana's and half the tooling on a developer laptop.
      # The container port stays 3000, so nothing inside the cluster changes;
      # set UI_PUBLIC_URL to match when you move it.
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-3000}:3000"
    restart: unless-stopped

  evaluator:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    profiles: ["evaluation"]
    entrypoint: []
    working_dir: /app
    command: ["python", "-m", "evaluation", "run", "--suite", "all"]
    volumes:
      - ./evaluation:/app/evaluation:ro
      - ./evaluation/results:/app/evaluation/results
      # Read-only, so the harness can register the agent's prompts in MLflow and
      # compare its own digest against the one the running agent reports.
      - ./agent/config.yml:/app/agent-config.yml:ro
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      AGENT_WORKFLOW_URL: ${AGENT_WORKFLOW_URL:-http://agent:8000/v1/workflow/full}
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-agent-api-key-change-me}
      MLFLOW_GENAI_EVAL_SKIP_TRACE_VALIDATION: ${MLFLOW_GENAI_EVAL_SKIP_TRACE_VALIDATION:-true}
      MLFLOW_GENAI_EVAL_MAX_WORKERS: ${MLFLOW_GENAI_EVAL_MAX_WORKERS:-1}
      MLFLOW_ENABLE_ASYNC_TRACE_LOGGING: ${MLFLOW_ENABLE_ASYNC_TRACE_LOGGING:-false}
      EVALUATION_HTTP_TIMEOUT_SECONDS: ${EVALUATION_HTTP_TIMEOUT_SECONDS:-360}
      EVALUATION_HTTP_MAX_ATTEMPTS: ${EVALUATION_HTTP_MAX_ATTEMPTS:-4}
      # The tool names the harness recognises as workflow tool calls. A domain
      # application overrides this instead of editing the harness.
      EVALUATION_TOOL_NAMES: ${EVALUATION_TOOL_NAMES:-search_tickets,get_ticket}
      # This container has no .git and no working tree, so the host is the only
      # place that can answer what commit the harness is running. GIT_SOURCE says
      # where that answer came from — a git checkout, or nowhere. GIT_DIRTY is
      # empty unless a real git tree was examined, so "not observable" never
      # renders as "clean".
      GIT_COMMIT: ${GIT_COMMIT:-}
      GIT_DIRTY: ${GIT_DIRTY:-}
      GIT_SOURCE: ${GIT_SOURCE:-}
      # MLflow probes for a git repo through GitPython on import. There is no git
      # binary here by design, and the commit is supplied above, so silence the
      # multi-paragraph warning it would otherwise print before every suite.
      GIT_PYTHON_REFRESH: quiet
      AGENT_CONFIG_PATH: ${AGENT_CONFIG_PATH:-/app/agent-config.yml}
      GUARDRAILS_EVALUATION_EXPERIMENT: ${GUARDRAILS_EVALUATION_EXPERIMENT:-tickets-agent-guardrails-evaluation}
      GUARDRAILS_EVALUATION_DATASET: ${GUARDRAILS_EVALUATION_DATASET:-tickets-agent-guardrails-dataset}
      TOOL_CALLING_EVALUATION_EXPERIMENT: ${TOOL_CALLING_EVALUATION_EXPERIMENT:-tickets-agent-tool-calling-evaluation}
      TOOL_CALLING_EVALUATION_DATASET: ${TOOL_CALLING_EVALUATION_DATASET:-tickets-agent-tool-calling-dataset}
      GROUNDING_EVALUATION_EXPERIMENT: ${GROUNDING_EVALUATION_EXPERIMENT:-tickets-agent-grounding-evaluation}
      GROUNDING_EVALUATION_DATASET: ${GROUNDING_EVALUATION_DATASET:-tickets-agent-grounding-dataset}
      INJECTION_EVALUATION_EXPERIMENT: ${INJECTION_EVALUATION_EXPERIMENT:-tickets-agent-injection-evaluation}
      INJECTION_EVALUATION_DATASET: ${INJECTION_EVALUATION_DATASET:-tickets-agent-injection-dataset}
    networks:
      - agent_net
      - telemetry_net
    depends_on:
      mlflow:
        condition: service_healthy
      agent:
        condition: service_healthy

networks:
  # Each network is one trust relationship. Membership decides which containers
  # can route to a service at all; publishing a host port (see `ports:`) is what
  # decides whether the host and browser can. NAT, MCP, PostgreSQL and the
  # gateway publish nothing, so they are unreachable from outside the cluster.
  #
  # None of these are `internal: true`. That flag removes a network's default
  # route, i.e. it blocks *egress*; it does nothing for inbound reachability,
  # which is already governed by `ports:`. The agent must reach the model
  # endpoint (host.docker.internal in development, a hosted endpoint otherwise),
  # so marking its networks internal would break inference without adding any
  # protection this topology does not already have.

  # Browser/host-facing services. Only members of this network publish ports.
  edge:
  # assistant-ui -> Rust gateway. The UI never reaches NAT or MCP.
  gateway_net:
  # Rust gateway -> Keycloak OIDC backchannel.
  auth_net:
  # Rust gateway and the containerized evaluator -> NAT. Nothing else routes here.
  agent_net:
  # NAT and the loopback-only MCP Inspector -> Rust MCP server.
  mcp_net:
  # MCP server -> PostgreSQL. The database is reachable from one service only.
  data_net:
  # Trace export: NAT/evaluator -> OpenTelemetry Collector -> MLflow.
  telemetry_net:

volumes:
  # Each default derives from the *effective* project name — set by `-p`, by
  # `COMPOSE_PROJECT_NAME`, or by the `tickets-agent` default at the top of this
  # file, in that order — so two projects on the same Docker host get separate
  # storage automatically, the same way they already get separate containers
  # and networks. An unconditional literal name here would pin every project to
  # the exact same volume regardless of which project asked for it:
  # `-p`/`COMPOSE_PROJECT_NAME` would isolate everything *except* the data.
  #
  # Still overridable per volume, so a deployment that wants one specific,
  # stable name (e.g. to keep reusing a volume across a project rename) can set
  # it explicitly; an explicit override always wins over the computed default.
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-tickets-agent}-postgres-data}
  mlflow-data:
    name: ${MLFLOW_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-tickets-agent}-mlflow-data}
  keycloak-data:
    name: ${KEYCLOAK_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-tickets-agent}-keycloak-data}
  keycloak-import:
    name: ${KEYCLOAK_IMPORT_VOLUME:-${COMPOSE_PROJECT_NAME:-tickets-agent}-keycloak-import}
